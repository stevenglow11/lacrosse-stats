<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lacrosse Results</title>
  <meta name="description" content="Public game results for Team 91 2033 and Brick 5/6.">
  <meta name="theme-color" content="#e7f0e4">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("laxstats.resultsTheme");
        var dark = theme === "dark" || (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#0c1410" : "#e7f0e4");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app" class="app"></div>
  <script type="module" src="js/results.js"></script>
</body>
</html>
